name: CI/CD Pipeline - Task Management & Portfolio

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Root & Frontend Dependencies
        run: npm install

      - name: 4. Install Backend Dependencies
        run: cd task-manager-api && npm install

      - name: 5. Run Automated Backend Test Suite
        run: npm test

      - name: 6. Build Frontend Production Artifact
        run: npm run build
