version: '3.8'

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: taskmanager-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=taskmanager
    volumes:
      - mongodb_data:/data/db
    networks:
      - task-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Node/Express Backend API Service
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskmanager
      - JWT_SECRET=taskmanager-super-secret-docker-jwt-key
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - task-network

  # 3. React Frontend Service (Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - task-network

networks:
  task-network:
    driver: bridge

volumes:
  mongodb_data:
